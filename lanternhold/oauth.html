<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Lanternhold sign-in</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1220;color:#e8eef8;font:16px/1.5 Inter,system-ui,sans-serif;text-align:center;padding:16px}</style>
</head><body><p id="m">Checking…</p>
<script>
// Support tasks (v132): Discord or itch.io sends the player back here with a read-only token in the URL hash.
// Hand it to the game window that opened this pop-up, or keep it briefly and go back to the game if there is no opener.
(function () {
  var h = new URLSearchParams(location.hash.slice(1)), q = new URLSearchParams(location.search);
  history.replaceState(null, '', location.pathname);
  var m = { token: h.get('access_token') || '', state: h.get('state') || q.get('state') || '', at: Date.now() };
  if (!m.token) { document.getElementById('m').textContent = (q.get('error') || h.get('error')) ? 'Sign-in was cancelled. You can close this window.' : 'Nothing to check. You can close this window.'; }
  if (window.opener && m.token) { try { window.opener.postMessage({ lhOauth: m }, location.origin); window.close(); return; } catch (e) {} }
  if (m.token) { try { localStorage.setItem('lh_oauth', JSON.stringify(m)); } catch (e) {} location.replace('/'); }
})();
</script></body></html>
