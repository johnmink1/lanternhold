# Publishes the Lanternhold game to lanternhold.born2gamellc.com on every push to main.
# The game's source lives in this repository (moved from johnmink1/pricing-tools on 24 Nov 2026).
name: Deploy Lanternhold
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['lanternhold/**', 'lanternhold-wiki/**', '.github/workflows/deploy.yml']
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - name: Get the game
        uses: actions/checkout@v5
        with:
          path: src
      - name: Skip if nothing changed
        id: check
        run: |
          sha=$(cd src && git log -1 --format=%H -- lanternhold lanternhold-wiki)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          live=$(curl -fsS https://lanternhold.born2gamellc.com/deployed-from.txt || true)
          if [ "$live" = "$sha" ] && [ "${{ github.event_name }}" = "schedule" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - name: Build the site folder
        if: steps.check.outputs.skip != '1'
        run: |
          mkdir site
          cp -r src/lanternhold/. site/
          echo "lanternhold.born2gamellc.com" > site/CNAME
          touch site/.nojekyll
          printf 'User-agent: *\nAllow: /\nSitemap: https://lanternhold.born2gamellc.com/sitemap.xml\n' > site/robots.txt
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n<url><loc>https://lanternhold.born2gamellc.com/</loc></url>\n</urlset>\n' > site/sitemap.xml
          echo "${{ steps.check.outputs.sha }}" > site/deployed-from.txt
      - name: Build the player wiki from the game's data
        if: steps.check.outputs.skip != '1'
        run: |
          if [ -f src/lanternhold-wiki/build.js ]; then
            node src/lanternhold-wiki/build.js src/lanternhold site https://lanternhold.born2gamellc.com || echo "::warning::The wiki did not build; the game still publishes."
          fi
      - uses: actions/configure-pages@v5
        if: steps.check.outputs.skip != '1'
      - uses: actions/upload-pages-artifact@v4
        if: steps.check.outputs.skip != '1'
        with:
          path: site
      - id: deployment
        if: steps.check.outputs.skip != '1'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # GitHub sometimes can't see a just-uploaded artifact yet; give it a moment and publish again.
      - name: Wait before retrying the publish
        if: steps.check.outputs.skip != '1' && steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment2
        if: steps.check.outputs.skip != '1' && steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
